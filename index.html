<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>scaRnet.de</title>

<!-- Steht in Google-Treffern und Link-Vorschauen. Muss mit og:description
     weiter unten uebereinstimmen. -->
<meta name="description" content="Die persönliche Seite von scaR im Netz — daher der Name.">

<link rel="canonical" href="https://scarnet.de/">

<!-- Der Kopf des Hundes aus dem Hero-Bild, 64 px. Vorher stand hier ein
     eingebettetes SVG mit einem "s" in Arial — das sparte zwar den Request,
     zeigte aber ausgerechnet nicht das R, das den Namen ausmacht. Ein Foto
     laesst sich nicht als SVG einbetten, und 2,8 KB als data:-URL wuerden
     dieses HTML um die Haelfte aufblaehen, bei jedem Abruf. Deshalb als
     Datei. Der Typ steht ausdruecklich dabei, damit kein Browser zusaetzlich
     /favicon.ico anfragt und eine 404 einsammelt. -->
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">

<!-- Das Hero-Bild steckt im CSS und wird vom Browser erst nach dem Stylesheet entdeckt.
     Der Preload holt es sofort; media sorgt dafür, dass weiterhin nur eines der beiden lädt. -->
<link rel="preload" as="image" href="Welcome.jpg" media="(min-width:769px)">
<link rel="preload" as="image" href="Welcome-mobile.jpg" media="(max-width:768px)">

<meta property="og:type" content="website">
<meta property="og:url" content="https://scarnet.de/">
<meta property="og:title" content="scaRnet">
<meta property="og:description" content="Die persönliche Seite von scaR im Netz — daher der Name.">
<meta property="og:image" content="https://scarnet.de/Welcome.jpg">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;

    /* Muss hier stehen, seit das Menü Text enthält: ohne Angabe erbt die
       Seite die Voreinstellung des Browsers, und die ist eine Serifenschrift.
       Systemschriften statt Google Fonts — es soll nichts nachgeladen werden. */
    font-family:ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
}

/* Desktop */
.hero{
    position:relative;   /* Bezugsrahmen fuer die Fusszeile weiter unten */
    width:100%;
    height:100vh;
    height:100svh;   /* mobil: rechnet die Adressleiste raus, sonst wird unten abgeschnitten */

    background-image:url('Welcome.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* Mobile — nur die Bildquelle wechselt, der Rest von oben gilt weiter */
@media (max-width:768px){

    .hero{
        background-image:url('Welcome-mobile.jpg');
    }

}

/* ---------- Menü ----------
   Liegt als schmale Leiste über dem Bild. Neue Reiter kommen unten im <nav>
   dazu; die Liste scrollt auf schmalen Geräten seitwärts, statt umzubrechen. */
.nav{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    height:52px;
    display:flex;
    align-items:center;
    gap:clamp(16px,4vw,40px);
    padding:0 clamp(14px,4vw,30px);
    background:rgba(0,0,0,.46);
    backdrop-filter:blur(12px) saturate(140%);
    -webkit-backdrop-filter:blur(12px) saturate(140%);
    border-bottom:1px solid rgba(255,255,255,.09);
}

/* Beschriftung der Leiste, absichtlich kein Link — die Ziele stehen rechts. */
.mark{
    flex:none;
    font-size:11px;
    font-weight:600;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:rgba(255,255,255,.38);
    white-space:nowrap;
    -webkit-user-select:none;
    user-select:none;
}

.tabs{
    display:flex;
    gap:4px;
    margin-left:auto;
    overflow-x:auto;
    scrollbar-width:none;
}
.tabs::-webkit-scrollbar{ display:none; }

.tabs a{
    flex:none;
    padding:7px 12px;
    border-radius:6px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:rgba(255,255,255,.62);
    text-decoration:none;
    white-space:nowrap;
    transition:color .15s, background .15s;
}
.tabs a:hover{
    color:#fff;
    background:rgba(255,255,255,.09);
}
.tabs a[aria-current="page"]{
    color:#fff;
    background:rgba(255,255,255,.14);
}
.tabs a:focus-visible{
    outline:2px solid #fff;
    outline-offset:2px;
}

/* Handy: Antippflächen auf mindestens 44 Pixel Höhe bringen, sonst trifft man
   mit dem Daumen daneben. Passt weiterhin in die 52 Pixel hohe Leiste.
   Die Zeilenhöhe steht hier ausdrücklich, weil diese Seite anders als der
   Rauchfrei-Bereich keine auf dem body setzt — sonst fehlt ein Pixel. */
@media (max-width:768px){
    .tabs a{
        padding:14px 12px;
        line-height:1.6;
    }
}

/* ---------- Fußzeile ----------
   Impressum und Datenschutz stehen unten und nicht als Reiter im Menü. Mit
   vier Reitern scrollt die Leiste auf einem 375 Pixel breiten Display seitwärts
   und der letzte Eintrag fällt aus dem Bild — ausgerechnet der, der leicht
   erreichbar sein muss. Unten sucht ihn ohnehin jeder zuerst.

   Absolut im Hero, nicht fixed: der Hero ist 100svh hoch und endet damit über
   der Adressleiste des Handybrowsers. Ein fixed-Element auf bottom:0 läge
   darunter. */
.rechtsfuss{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:2px;
    padding:6px clamp(14px,4vw,30px) 8px;
    background:linear-gradient(to top, rgba(0,0,0,.5), rgba(0,0,0,0));
}

.rechtsfuss a{
    padding:7px 10px;
    border-radius:6px;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:rgba(255,255,255,.62);
    text-decoration:none;
    /* Ausdruecklich, weil diese Seite anders als der Rauchfrei-Bereich keine
       Zeilenhoehe auf dem body setzt — ohne sie fehlen dem Antippfeld unten
       ein paar Pixel an den geforderten 44. */
    line-height:1.6;
    transition:color .15s, background .15s;
}
.rechtsfuss a:hover{
    color:#fff;
    background:rgba(255,255,255,.09);
}
.rechtsfuss a:focus-visible{
    outline:2px solid #fff;
    outline-offset:2px;
}
.rechtsfuss .punkt{
    color:rgba(255,255,255,.3);
    font-size:11px;
}

/* Handy: gleiche 44 Pixel Antippfläche wie im Menü. */
@media (max-width:768px){
    .rechtsfuss a{ padding:14px 12px; }
}

/* Der Schriftzug steckt als Pixel im Bild. Diese Überschrift bleibt unsichtbar,
   existiert aber für Screenreader und Suchmaschinen. */
.sr-only{
    position:absolute;
    width:1px;
    height:1px;
    margin:-1px;
    overflow:hidden;
    clip-path:inset(50%);
    white-space:nowrap;
}

</style>
</head>

<body>

<h1 class="sr-only">scaRnet</h1>

<!-- MENÜ — hier kommen neue Reiter dazu. Auf der jeweils eigenen Seite
     bekommt der Reiter aria-current="page", damit er hervorgehoben wird. -->
<nav class="nav">
  <span class="mark">Menü</span>
  <div class="tabs">
    <a href="/" aria-current="page">Start</a>
    <a href="/rauchfrei.html" id="zuRauchfrei">Rauchfrei</a>
  </div>
</nav>

<script>
/* Die Unterseite wird immer frisch geholt, nie aus dem Zwischenspeicher.

   GitHub Pages liefert jede Datei mit zehn Minuten Haltbarkeit aus. Beim
   Klick auf den Reiter bekam ein Handy dadurch eine alte Fassung des HTML,
   die auf andere Skriptadressen verweist als die heutige — und dann passt
   das Markup nicht mehr zum Skript. Am 18.08.2026 genau so passiert.

   Das HTML ist 13 KB gross, es jedes Mal neu zu holen kostet also nichts.
   Die grossen Dateien, CSS und JS, behalten ihre lange Haltbarkeit ueber
   die Fassungsnummer in ihrer Adresse. Ohne JavaScript bleibt der Verweis
   im href stehen und funktioniert weiterhin. */
document.getElementById("zuRauchfrei").href = "/rauchfrei.html?f=" + Date.now();
</script>

<div class="hero">

  <!-- Pflichtangaben. Bewusst hier und nicht im Menü — siehe Kommentar im CSS. -->
  <footer class="rechtsfuss">
    <a href="/impressum.html">Impressum</a>
    <span class="punkt" aria-hidden="true">·</span>
    <a href="/datenschutz.html">Datenschutz</a>
  </footer>

</div>

</body>
</html>
