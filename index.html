<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>scaRnet.de</title>

<!-- Steht in Google-Treffern und Link-Vorschauen. Muss mit og:description
     weiter unten uebereinstimmen. -->
<meta name="description" content="Die persönliche Seite von scaR im Netz — daher der Name.">

<link rel="canonical" href="https://scarnet.de/">

<!-- Der Kopf des Hundes aus dem Hero-Bild, 64 px. Vorher stand hier ein
     eingebettetes SVG mit einem "s" in Arial — das sparte zwar den Request,
     zeigte aber ausgerechnet nicht das R, das den Namen ausmacht. Ein Foto
     laesst sich nicht als SVG einbetten, und 2,8 KB als data:-URL wuerden
     dieses HTML um die Haelfte aufblaehen, bei jedem Abruf. Deshalb als
     Datei. Der Typ steht ausdruecklich dabei, damit kein Browser zusaetzlich
     /favicon.ico anfragt und eine 404 einsammelt. -->
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">

<!-- Die Schrift steckt im CSS und wird sonst erst nach dem Parsen entdeckt. Ohne
     Preload springt die Seite sichtbar von der Systemschrift auf Space Grotesk.
     Michroma steht bewusst nicht hier: die Anzeigeschrift kommt erst unter dem
     Hero vor und soll dem Foto die Leitung nicht streitig machen. -->
<link rel="preload" as="font" type="font/woff2" href="schriften/space-grotesk.woff2" crossorigin>

<!-- Das Hero-Bild steckt im CSS und wird vom Browser erst nach dem Stylesheet entdeckt.
     Der Preload holt es sofort; media sorgt dafür, dass weiterhin nur eines der beiden lädt. -->
<link rel="preload" as="image" href="Welcome.jpg" media="(min-width:769px)" fetchpriority="high">
<link rel="preload" as="image" href="Welcome-mobile.jpg" media="(max-width:768px)" fetchpriority="high">

<meta property="og:type" content="website">
<meta property="og:url" content="https://scarnet.de/">
<meta property="og:title" content="scaRnet">
<meta property="og:description" content="Die persönliche Seite von scaR im Netz — daher der Name.">
<meta property="og:image" content="https://scarnet.de/Welcome.jpg">

<style>

/* ---------- Schriften ----------
   Selbst gehostet. Keine Google Fonts: die Einbindung von fonts.googleapis.com
   überträgt die IP des Besuchers an einen Dritten und ist abmahnungsrelevant
   (LG München I, 2022). Von hier ausgeliefert stellt sich die Frage nicht.

   Vier Dateien liegen im Repo, benutzt werden zwei: Space Grotesk für den
   Fließtext, Michroma für die Anzeige. Michroma ist eine breite, kantige
   Groteske in der Linie von Eurostile — dieselbe Familie von Formen wie der
   Schriftzug im Hero-Foto, und die Schrift, die die Achtziger auf jedem
   Vorspann und jeder Plattenhülle benutzt haben.

   Inter und Manrope liegen unbenutzt daneben. Das kostet den Besucher nichts —
   einen @font-face-Block, auf den keine Regel zeigt, lädt kein Browser.

   Lateinische Teilmenge, deckt äöü und ß ab. Bezogen über Google Fonts,
   SIL Open Font License — die Lizenztexte liegen bei den Dateien. */
@font-face{
  font-family:"Space Grotesk"; font-style:normal; font-weight:300 700;
  font-display:swap;
  src:url("schriften/space-grotesk.woff2") format("woff2-variations");
}
@font-face{
  font-family:"Michroma"; font-style:normal; font-weight:400;
  font-display:swap;
  src:url("schriften/michroma.woff2") format("woff2");
}
@font-face{
  font-family:"Inter"; font-style:normal; font-weight:100 900;
  font-display:swap;
  src:url("schriften/inter.woff2") format("woff2-variations");
}
@font-face{
  font-family:"Manrope"; font-style:normal; font-weight:200 800;
  font-display:swap;
  src:url("schriften/manrope.woff2") format("woff2-variations");
}

/* ---------- Farbwelt ----------
   Aus dem Foto heraus entwickelt, nicht danebengestellt: der Gang leuchtet
   cyan, die Kabel links leuchten bernstein. Beides sind Neonfarben, man muss
   sie nur ernst nehmen. Magenta kommt dazu, weil ein Horizont in den
   Achtzigern magenta war. Drei Farben, mehr nicht — Disco heisst nicht bunt,
   Disco heisst wenige Farben, die brennen. */
:root{
    --nacht:   #06050E;
    --tief:    #120726;
    --violett: #2A0F52;
    --magenta: #FF2E8B;
    --cyan:    #22E4FF;
    --gold:    #FFC24A;
    --flieder: #A85CFF;
    --gruen:   #4BFFA5;
    --text:    #F4EEFF;
    --leise:   #B7A9DA;
    --fern:    #7B6DA0;

    --anzeige: "Michroma", "Eurostile", "Bank Gothic", ui-sans-serif, system-ui, sans-serif;
    --sans: "Space Grotesk", ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--nacht);
    color:var(--text);

    /* Muss hier stehen, seit das Menü Text enthält: ohne Angabe erbt die
       Seite die Voreinstellung des Browsers, und die ist eine Serifenschrift. */
    font-family:var(--sans);
    font-size:15.5px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
}

/* ---------- Menü ----------
   Bleibt bewusst so nüchtern wie auf den anderen Seiten. Die Leiste ist das
   einzige Bauteil, das über alle fünf Seiten läuft — färbt man sie hier ein,
   wechselt sie beim ersten Klick die Farbe und wirkt kaputt. Neon gibt es
   unten, wo es hingehört. */
.nav{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:30;
    height:52px;
    display:flex;
    align-items:center;
    gap:clamp(16px,4vw,40px);
    padding:0 clamp(14px,4vw,30px);
    background:rgba(0,0,0,.46);
    backdrop-filter:blur(12px) saturate(140%);
    -webkit-backdrop-filter:blur(12px) saturate(140%);
    border-bottom:1px solid rgba(255,255,255,.09);
}

/* Der Name der Seite. Absichtlich kein Link — die Ziele stehen rechts. */
.mark{
    flex:none;
    font-size:15.5px;
    font-weight:600;
    letter-spacing:-.015em;
    color:rgba(255,255,255,.92);
    white-space:nowrap;
    -webkit-user-select:none;
    user-select:none;
}

.tabs{
    display:flex;
    gap:4px;
    margin-left:auto;
    overflow-x:auto;
    scrollbar-width:none;
}
.tabs::-webkit-scrollbar{ display:none; }

.tabs a{
    flex:none;
    padding:7px 12px;
    border-radius:6px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:rgba(255,255,255,.62);
    text-decoration:none;
    white-space:nowrap;
    transition:color .15s, background .15s;
}
.tabs a:hover{ color:#fff; background:rgba(255,255,255,.09); }
.tabs a[aria-current="page"]{ color:#fff; background:rgba(255,255,255,.14); }
.tabs a:focus-visible{ outline:2px solid #fff; outline-offset:2px; }

/* Handy: Antippflächen auf mindestens 44 Pixel Höhe bringen, sonst trifft man
   mit dem Daumen daneben. Passt weiterhin in die 52 Pixel hohe Leiste. */
@media (max-width:768px){
    .tabs a{ padding:14px 12px; line-height:1.6; }
}

/* ---------- Hero ----------
   Ein Bildschirm Foto, sonst nichts. Kein <img>, keine Leinwand, kein Skript:
   das Bild steht still, so wie es sich gehört. Der einzige Zusatz ist der
   Verlauf am unteren Rand, der es in die Nacht darunter übergehen lässt. */
.hero{
    position:relative;
    width:100%;
    height:100vh;
    height:100svh;   /* mobil: rechnet die Adressleiste raus, sonst wird unten abgeschnitten */
    min-height:420px;

    background-image:url('Welcome.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* Mobile — nur die Bildquelle wechselt, der Rest von oben gilt weiter */
@media (max-width:768px){
    .hero{ background-image:url('Welcome-mobile.jpg'); }
}

.hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:34%;
    background:linear-gradient(to top, var(--nacht) 6%, rgba(6,5,14,.55) 46%, rgba(6,5,14,0));
    pointer-events:none;
}

.hinweis{
    position:absolute;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
    padding:12px 16px;
    border-radius:8px;
    color:rgba(255,255,255,.72);
    text-decoration:none;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.2em;
    text-transform:uppercase;
    transition:color .15s, background .15s, text-shadow .2s;
}
.hinweis:hover{
    color:#fff;
    background:rgba(34,228,255,.09);
    text-shadow:0 0 12px rgba(34,228,255,.8);
}
.hinweis:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
.hinweis svg{ animation:tippen 2.6s ease-in-out infinite; }

/* ====================================================================
   DER CLUB
   Wo der Gang im Foto seinen Fluchtpunkt hat, geht die Seite weiter: ein
   Horizont, eine geschnittene Sonne, eine beleuchtete Tanzflaeche, die auf
   einen zulaeuft — und der Hund aus dem Foto darauf, freigestellt.

   Alles gerechnet: Kugel, Strahlen, Kacheln und Sonne sind CSS und ein
   kleines SVG. Das einzige zusaetzliche Byte ist der Hund selbst.
   ==================================================================== */
.club{
    position:relative;
    min-height:100vh;
    min-height:100svh;
    overflow:hidden;
    background:
        radial-gradient(140% 68% at 50% 54%, rgba(255,46,139,.30), transparent 60%),
        radial-gradient(90% 50% at 50% 100%, rgba(34,228,255,.16), transparent 70%),
        linear-gradient(to bottom, #05040C 0%, var(--tief) 30%, var(--violett) 51%, #14082C 52%, #07050F 100%);
}

/* Sterne. Ein Element, die Punkte stecken im Hintergrund. */
.sterne{
    position:absolute;
    left:0; right:0; top:0;
    height:54%;
    pointer-events:none;
    background-image:
        radial-gradient(1.4px 1.4px at 12% 24%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 26% 12%, #E7D8FF, transparent),
        radial-gradient(1.6px 1.6px at 38% 34%, #fff, transparent),
        radial-gradient(1.1px 1.1px at 52% 8%,  #CFE8FF, transparent),
        radial-gradient(1.5px 1.5px at 64% 28%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 76% 16%, #FFE7F6, transparent),
        radial-gradient(1.7px 1.7px at 88% 32%, #fff, transparent),
        radial-gradient(1.1px 1.1px at 8%  44%, #D8CCFF, transparent),
        radial-gradient(1.3px 1.3px at 33% 50%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 58% 46%, #CFE8FF, transparent),
        radial-gradient(1.4px 1.4px at 82% 48%, #fff, transparent),
        radial-gradient(1.1px 1.1px at 94% 20%, #FFD9EF, transparent),
        radial-gradient(1.3px 1.3px at 46% 20%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 18% 36%, #fff, transparent);
    animation:blinzeln 7s ease-in-out infinite alternate;
}

/* Die Discokugel. Facetten aus einem sich drehenden Kegelverlauf,
   Rundung aus einem Radialverlauf, Aufhaengung aus einer Linie. */
.kugel{
    position:absolute;
    /* Haengt unter der Menueleiste, nicht dahinter — sonst ist die Kugel
       genau dort angeschnitten, wo man auf dem Abschnitt landet. Und sie
       haengt AUS DER MITTE: vorher standen Kugel, Schild, Sonne, Hund und
       Fluchtpunkt alle auf derselben Achse, und die Kugel lag mitten auf
       der Schrift darunter. */
    top:44px; left:24%;
    width:clamp(52px,8vw,86px);
    transform:translateX(-50%);
    pointer-events:none;
}
.kugel::before{
    content:"";
    display:block;
    width:2px; height:clamp(16px,4vh,34px);
    margin:0 auto;
    background:linear-gradient(to bottom, rgba(255,255,255,.05), rgba(255,255,255,.4));
}
.kugel::after{
    content:"";
    display:block;
    width:100%; aspect-ratio:1;
    border-radius:50%;
    background:
        repeating-conic-gradient(from 0deg, rgba(255,255,255,.26) 0 5deg, rgba(120,160,220,.06) 5deg 10deg),
        repeating-linear-gradient(0deg, rgba(0,0,0,.34) 0 4px, transparent 4px 9px),
        radial-gradient(circle at 32% 26%, #F2FAFF 0%, #93A8D8 34%, #3A4270 66%, #12162E 100%);
    box-shadow:0 0 34px rgba(190,225,255,.5), 0 0 110px rgba(168,92,255,.42), 0 0 200px rgba(34,228,255,.2);
    animation:drehen 14s linear infinite;
}

/* Die Sonne. Die Schnitte werden nach unten breiter — genau das macht sie. */
.sonne{
    position:absolute;
    top:calc(52% - min(21vw,164px));
    left:50%;
    transform:translateX(-50%);
    width:min(42vw,328px);
    height:min(42vw,328px);
    pointer-events:none;
    filter:drop-shadow(0 0 54px rgba(255,46,139,.5));
}

/* Der Horizont: die Linie, an der der Boden anfaengt. */
.horizont{
    position:absolute;
    left:0; right:0;
    top:52%;
    height:2px;
    pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(34,228,255,.9) 20%, #fff 50%, rgba(34,228,255,.9) 80%, transparent);
    box-shadow:0 0 30px 7px rgba(34,228,255,.42);
}

/* ---------- Die Tanzflaeche ----------
   Eine echte perspektivische Ebene: das Muster liegt flach und wird gekippt.

   Es sind KEINE Elemente mehr, sondern zwei Hintergrundebenen. Vorher lagen
   hier 432 einzelne Kacheln — bei 1440 Pixeln Fensterbreite waren davon
   sechzig sichtbar, der Rest lief unsichtbar mit. Schlimmer: die Kacheln
   waren Bruchteile der Fensterbreite, die Kameradistanz aber fest. Auf einem
   breiten Bildschirm wurden daraus vier Farbschollen statt einer Flaeche.

   Als Muster ist die Kachel 76 Pixel gross — auf jedem Bildschirm gleich,
   und sie wiederholt sich von allein so weit, wie die Ebene reicht. Zwei
   Ebenen mit verschobener Farbfolge blenden gegeneinander: so wechselt die
   Flaeche die Farbe, wie sie das gehoert. */
.flaeche{
    position:absolute;
    left:0; right:0;
    top:52%;
    bottom:0;
    overflow:hidden;
    pointer-events:none;
    perspective:340px;
    perspective-origin:50% 0%;
    background:#0A0518;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 15%);
    mask-image:linear-gradient(to bottom, transparent 0, #000 15%);
}
/* Das Licht der Sonne, das auf dem Boden liegt. Absichtlich gesetzt: vorher
   schien die Sonne durch die halbdurchsichtigen Kacheln durch und endete in
   einer geraden Kante — das sah nach Fehler aus, nicht nach Spiegelung. */
.flaeche::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom, rgba(255,90,170,.26) 0%, rgba(255,90,170,.07) 24%, transparent 52%);
}
.kacheln{
    position:absolute;
    left:-32%; right:-32%;
    top:0;
    height:340%;
    transform-origin:50% 0%;
    transform:rotateX(72deg);
}
.kacheln span{
    position:absolute;
    inset:0;
    background-image:
        repeating-linear-gradient(90deg, rgba(0,0,0,.66) 0 3px, transparent 3px 76px),
        repeating-linear-gradient(0deg,  rgba(0,0,0,.66) 0 3px, transparent 3px 76px),
        conic-gradient(from 0deg at 50% 50%,
            var(--magenta) 0 25%, var(--cyan) 25% 50%,
            var(--gold) 50% 75%, var(--flieder) 75% 100%);
    background-size:76px 76px, 76px 76px, 152px 152px;
    opacity:.92;
}
.kacheln .b{
    background-image:
        repeating-linear-gradient(90deg, rgba(0,0,0,.66) 0 3px, transparent 3px 76px),
        repeating-linear-gradient(0deg,  rgba(0,0,0,.66) 0 3px, transparent 3px 76px),
        conic-gradient(from 0deg at 50% 50%,
            var(--cyan) 0 25%, var(--gruen) 25% 50%,
            var(--flieder) 50% 75%, var(--gold) 75% 100%);
    background-position:0 0, 0 0, 76px 76px;
    opacity:0;
    animation:wechsel 4.4s ease-in-out infinite;
}

/* ---------- Der Hund ----------
   Freigestellt aus demselben Foto, das oben im Hero steht — er laeuft also
   dieselbe Gangart, nur eben nicht mehr durchs Rechenzentrum. Unten laeuft
   er weich aus: an den Laeufen ist die Freistellung ausgefranst, und auf
   einer beleuchteten Flaeche steht ohnehin alles im Lichtnebel. Der Rand
   links magenta, rechts cyan — so leuchtet ihn der Raum an. */
.hund{
    position:absolute;
    left:50%;
    bottom:6%;
    z-index:5;
    height:min(38svh,296px);
    width:auto;
    transform:translateX(-50%);
    -webkit-mask-image:linear-gradient(to top, transparent 0, #000 12%);
    mask-image:linear-gradient(to top, transparent 0, #000 12%);
    /* Eng gehaltene Schlagschatten: so lesen sie als Randlicht von links
       und rechts. Weit und weich ueberlagern sie sich hinter dem Hund zu
       einem hellen Kasten — das sah aus wie ein Ausschnittfehler. */
    /* Eng gehalten, sonst liest es sich als Farbversatz wie bei einem
       schlecht registrierten Druck statt als Randlicht. */
    filter:
        saturate(1.18) contrast(1.06)
        drop-shadow(0 10px 14px rgba(0,0,0,.62))
        drop-shadow(-3px 0 2px rgba(255,46,139,.6))
        drop-shadow(3px 0 2px rgba(34,228,255,.6));
    animation:tappen 3.6s ease-in-out infinite;
}
/* Der Lichtnebel an den Pfoten. Er hat eine Aufgabe: der Hund laeuft unten
   weich aus, weil die Freistellung an den Laeufen ausfranst — dieser Schein
   macht daraus Licht statt eines Schnitts. Deshalb sitzt er genau auf
   Pfotenhoehe und nicht am unteren Rand. */
.hundschatten{
    position:absolute;
    left:50%;
    bottom:5.5%;
    z-index:4;
    width:min(28vw,196px);
    height:min(4.4vh,30px);
    transform:translateX(-50%);
    pointer-events:none;
    border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.72), rgba(0,0,0,.3) 52%, transparent 74%);
    filter:blur(7px);
}
.hundlicht{
    position:absolute;
    left:50%;
    bottom:4%;
    z-index:4;
    width:min(58vw,420px);
    height:min(16vh,120px);
    transform:translateX(-50%);
    pointer-events:none;
    border-radius:50%;
    background:radial-gradient(ellipse at center,
        rgba(255,255,255,.55) 0%, rgba(180,240,255,.42) 24%,
        rgba(34,228,255,.30) 46%, rgba(255,46,139,.18) 66%, transparent 78%);
    filter:blur(16px);
    animation:atmen 3.6s ease-in-out infinite;
}

/* ---------- Was auf der Flaeche steht ---------- */
.club-inhalt{
    position:absolute;
    left:50%;
    top:clamp(88px,13%,150px);
    z-index:6;
    width:min(92vw,620px);
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(14px,2.6vh,24px);
    text-align:center;
}

/* Das Leuchtschild. Der einzige Weg, den diese Seite anbietet — also
   bekommt er die Roehre und nicht eine Karte mit Pfeil. */
.schild{
    position:relative;
    display:block;
    padding:clamp(16px,3vw,28px) clamp(24px,5.5vw,54px);
    border:2px solid rgba(34,228,255,.55);
    border-radius:7px;
    background:rgba(12,5,30,.42);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    box-shadow:
        0 0 22px rgba(34,228,255,.32),
        inset 0 0 24px rgba(34,228,255,.16);
    text-decoration:none;
    color:inherit;
    transition:border-color .25s, box-shadow .25s, transform .25s;
}
.schild:hover{
    border-color:rgba(34,228,255,.95);
    box-shadow:0 0 38px rgba(34,228,255,.55), inset 0 0 28px rgba(34,228,255,.24);
    transform:translateY(-2px);
}
.schild:focus-visible{ outline:2px solid #fff; outline-offset:5px; }

.schild-wort{
    display:block;
    font-family:var(--anzeige);
    font-size:clamp(30px,6.6vw,54px);
    line-height:1.06;
    letter-spacing:.045em;
    text-transform:uppercase;
    color:#FFF4FA;
    text-shadow:
        0 0 5px #fff,
        0 0 15px var(--magenta),
        0 0 36px var(--magenta),
        0 0 72px rgba(255,46,139,.66);
    animation:anspringen 2.8s ease-out both;
}
.schild:hover .schild-wort{
    text-shadow:0 0 6px #fff, 0 0 20px var(--magenta), 0 0 48px var(--magenta), 0 0 92px rgba(255,46,139,.8);
}
.schild-zeile{
    display:block;
    max-width:42ch;
    margin:12px auto 0;
    font-size:13px;
    letter-spacing:.06em;
    text-wrap:balance;
    color:var(--leise);
}

/* Bildroehren-Zeilen. Sehr schwach — man soll sie nicht sehen, man soll
   merken, dass das Bild von 1986 kommt. Nur hier unten, nicht ueber dem
   Foto: ein Raster auf einem Foto sieht nach Filter aus. */
.club::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:7;
    pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.30) 0 1px, transparent 1px 4px);
    opacity:.32;
    mix-blend-mode:multiply;
}

/* ---------- Fußzeile ----------
   Impressum und Datenschutz stehen unten und nicht als Reiter im Menü. Mit
   vier Reitern scrollt die Leiste auf einem 375 Pixel breiten Display seitwärts
   und der letzte Eintrag fällt aus dem Bild — ausgerechnet der, der leicht
   erreichbar sein muss. Unten sucht ihn ohnehin jeder zuerst. */
.rechtsfuss{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:2px;
    padding:22px clamp(14px,4vw,30px) 30px;
    background:var(--nacht);
    border-top:1px solid rgba(34,228,255,.22);
}
.rechtsfuss a{
    padding:7px 10px;
    border-radius:6px;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--leise);
    text-decoration:none;
    line-height:1.6;
    transition:color .15s, text-shadow .2s;
}
.rechtsfuss a:hover{ color:#fff; text-shadow:0 0 12px rgba(34,228,255,.8); }
.rechtsfuss a:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
.rechtsfuss .punkt{ color:var(--fern); font-size:11px; }

@media (max-width:768px){
    .rechtsfuss a{ padding:14px 12px; }
}

/* Der Schriftzug steckt als Pixel im Bild. Diese Überschrift bleibt unsichtbar,
   existiert aber für Screenreader und Suchmaschinen. */
.sr-only{
    position:absolute;
    width:1px;
    height:1px;
    margin:-1px;
    overflow:hidden;
    clip-path:inset(50%);
    white-space:nowrap;
}

/* ---------- Bewegung ---------- */
@keyframes wechsel{ 0%,44%{ opacity:0; } 50%,94%{ opacity:1; } 100%{ opacity:0; } }
@keyframes drehen{   from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
@keyframes schwenken{ from{ transform:translateX(-50%) rotate(-7deg); } to{ transform:translateX(-50%) rotate(7deg); } }
@keyframes tappen{ 0%,100%{ transform:translateX(-50%) translateY(0); } 50%{ transform:translateX(-50%) translateY(-5px); } }
@keyframes atmen{  0%,100%{ opacity:.75; transform:translateX(-50%) scale(1); } 50%{ opacity:1; transform:translateX(-50%) scale(1.06); } }
@keyframes blinzeln{
    from{ opacity:.55; }
    to  { opacity:1; }
}
@keyframes tippen{
    0%,100%{ transform:translateY(0);   opacity:.65; }
    50%    { transform:translateY(5px); opacity:1; }
}
/* Die Röhre springt an wie eine echte: dreimal zucken, dann steht sie.
   Bewusst über fast drei Sekunden gestreckt — schnelleres Flackern ist
   nicht nur unruhig, es ist bei Anfälligkeit für Anfälle ein Risiko. */
@keyframes anspringen{
    0%  { opacity:.10; }
    12% { opacity:1; }
    20% { opacity:.16; }
    38% { opacity:1; }
    50% { opacity:.38; }
    66% { opacity:1; }
    100%{ opacity:1; }
}

/* Wer Bewegung abgestellt hat, bekommt dasselbe Bild im Stand: die Röhre
   brennt, das Gitter steht, die Sterne stehen. */
@media (prefers-reduced-motion:reduce){
    .kacheln .b, .sterne, .kugel::after,
    .hund, .hundlicht, .schild-wort, .hinweis svg{ animation:none !important; }
    .kacheln .b{ opacity:.4; }
    .schild{ transition:none; }
}

</style>
</head>

<script>
/* Die Unterseite wird immer frisch geholt, nie aus dem Zwischenspeicher.

   GitHub Pages liefert jede Datei mit zehn Minuten Haltbarkeit aus. Beim
   Klick auf den Reiter bekam ein Handy dadurch eine alte Fassung des HTML,
   die auf andere Skriptadressen verweist als die heutige — und dann passt
   das Markup nicht mehr zum Skript. Am 18.08.2026 genau so passiert.

   rauchfrei.html ist 17 KB gross, es jedes Mal neu zu holen kostet also
   nichts. Die grossen Dateien, CSS und JS, behalten ihre lange Haltbarkeit
   ueber die Fassungsnummer in ihrer Adresse. Ohne JavaScript bleibt der
   Verweis im href stehen und funktioniert weiterhin.

   Es gibt zwei Wege dorthin — den Reiter und das Leuchtschild. Deshalb
   ueber ein Merkmal statt ueber eine Kennung. Mehr Skript hat diese Seite
   nicht: der Club ist gerechnetes CSS, kein Programm. */
(function(){
  var stempel = Date.now(), wege = document.querySelectorAll("a[data-rauchfrei]");
  for(var i=0;i<wege.length;i++){ wege[i].href = "/rauchfrei.html?f=" + stempel; }
})();
</script>
