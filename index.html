<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>scaRnet.de</title>

<!-- Steht in Google-Treffern und Link-Vorschauen. Muss mit og:description
     weiter unten uebereinstimmen. -->
<meta name="description" content="Die persönliche Seite von scaR im Netz — daher der Name.">

<link rel="canonical" href="https://scarnet.de/">

<!-- Favicon als SVG direkt eingebettet: spart einen Request und die 404 auf /favicon.ico -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='24' font-family='Arial,Helvetica,sans-serif' font-size='22' font-weight='bold' fill='%23fff' text-anchor='middle'%3Es%3C/text%3E%3C/svg%3E">

<!-- Das Hero-Bild steckt im CSS und wird vom Browser erst nach dem Stylesheet entdeckt.
     Der Preload holt es sofort; media sorgt dafür, dass weiterhin nur eines der beiden lädt. -->
<link rel="preload" as="image" href="Welcome.jpg" media="(min-width:769px)">
<link rel="preload" as="image" href="Welcome-mobile.jpg" media="(max-width:768px)">

<meta property="og:type" content="website">
<meta property="og:url" content="https://scarnet.de/">
<meta property="og:title" content="scaRnet">
<meta property="og:description" content="Die persönliche Seite von scaR im Netz — daher der Name.">
<meta property="og:image" content="https://scarnet.de/Welcome.jpg">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;

    /* Muss hier stehen, seit das Menü Text enthält: ohne Angabe erbt die
       Seite die Voreinstellung des Browsers, und die ist eine Serifenschrift.
       Systemschriften statt Google Fonts — es soll nichts nachgeladen werden. */
    font-family:ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
}

/* Desktop */
.hero{
    width:100%;
    height:100vh;
    height:100svh;   /* mobil: rechnet die Adressleiste raus, sonst wird unten abgeschnitten */

    background-image:url('Welcome.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* Mobile — nur die Bildquelle wechselt, der Rest von oben gilt weiter */
@media (max-width:768px){

    .hero{
        background-image:url('Welcome-mobile.jpg');
    }

}

/* ---------- Menü ----------
   Liegt als schmale Leiste über dem Bild. Neue Reiter kommen unten im <nav>
   dazu; die Liste scrollt auf schmalen Geräten seitwärts, statt umzubrechen. */
.nav{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    height:52px;
    display:flex;
    align-items:center;
    gap:clamp(16px,4vw,40px);
    padding:0 clamp(14px,4vw,30px);
    background:rgba(0,0,0,.46);
    backdrop-filter:blur(12px) saturate(140%);
    -webkit-backdrop-filter:blur(12px) saturate(140%);
    border-bottom:1px solid rgba(255,255,255,.09);
}

/* Beschriftung der Leiste, absichtlich kein Link — die Ziele stehen rechts. */
.mark{
    flex:none;
    font-size:11px;
    font-weight:600;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:rgba(255,255,255,.38);
    white-space:nowrap;
    -webkit-user-select:none;
    user-select:none;
}

.tabs{
    display:flex;
    gap:4px;
    margin-left:auto;
    overflow-x:auto;
    scrollbar-width:none;
}
.tabs::-webkit-scrollbar{ display:none; }

.tabs a{
    flex:none;
    padding:7px 12px;
    border-radius:6px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:rgba(255,255,255,.62);
    text-decoration:none;
    white-space:nowrap;
    transition:color .15s, background .15s;
}
.tabs a:hover{
    color:#fff;
    background:rgba(255,255,255,.09);
}
.tabs a[aria-current="page"]{
    color:#fff;
    background:rgba(255,255,255,.14);
}
.tabs a:focus-visible{
    outline:2px solid #fff;
    outline-offset:2px;
}

/* Handy: Antippflächen auf mindestens 44 Pixel Höhe bringen, sonst trifft man
   mit dem Daumen daneben. Passt weiterhin in die 52 Pixel hohe Leiste.
   Die Zeilenhöhe steht hier ausdrücklich, weil diese Seite anders als der
   Rauchfrei-Bereich keine auf dem body setzt — sonst fehlt ein Pixel. */
@media (max-width:768px){
    .tabs a{
        padding:14px 12px;
        line-height:1.6;
    }
}

/* Der Schriftzug steckt als Pixel im Bild. Diese Überschrift bleibt unsichtbar,
   existiert aber für Screenreader und Suchmaschinen. */
.sr-only{
    position:absolute;
    width:1px;
    height:1px;
    margin:-1px;
    overflow:hidden;
    clip-path:inset(50%);
    white-space:nowrap;
}

</style>
</head>

<body>

<h1 class="sr-only">scaRnet</h1>

<!-- MENÜ — hier kommen neue Reiter dazu. Auf der jeweils eigenen Seite
     bekommt der Reiter aria-current="page", damit er hervorgehoben wird. -->
<nav class="nav">
  <span class="mark">Menü</span>
  <div class="tabs">
    <a href="/" aria-current="page">Start</a>
    <a href="/rauchfrei.html" id="zuRauchfrei">Rauchfrei</a>
  </div>
</nav>

<script>
/* Die Unterseite wird immer frisch geholt, nie aus dem Zwischenspeicher.

   GitHub Pages liefert jede Datei mit zehn Minuten Haltbarkeit aus. Beim
   Klick auf den Reiter bekam ein Handy dadurch eine alte Fassung des HTML,
   die auf andere Skriptadressen verweist als die heutige — und dann passt
   das Markup nicht mehr zum Skript. Am 18.08.2026 genau so passiert.

   Das HTML ist 13 KB gross, es jedes Mal neu zu holen kostet also nichts.
   Die grossen Dateien, CSS und JS, behalten ihre lange Haltbarkeit ueber
   die Fassungsnummer in ihrer Adresse. Ohne JavaScript bleibt der Verweis
   im href stehen und funktioniert weiterhin. */
document.getElementById("zuRauchfrei").href = "/rauchfrei.html?f=" + Date.now();
</script>

<div class="hero"></div>

</body>
</html>
